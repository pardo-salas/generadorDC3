<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Generador de DC3</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-secondary text-white">
        <div class="container justify-content-center align-content-center container-fluid">
            <h1 class="text-center p-4">Generador de formatos DC3</h1>
            <div class="card bg-dark text-white border-secondary">
            <form id="dc3Form">

                <div class="card-header bg-dark text-white border-secondary">
                    <h5 class="card-title text-center">Datos del formato</h5>
                    <div class="card-tools">
                        <div class="row justify-content-center">
                            <div class="form-group col-md-3">
                                <a href="Plantilla_BaseDatos.xlsx" class="btn btn-success" download>Descargar Plantilla</a>  
                            </div>
                            <div class="form-group col-md-3">
                                <button type="submit" id="formato" class="btn btn-primary">Generar Formato</button>
                            </div>
                            <div class="form-group col-md-3">
                                <button type="submit" id="constancia" class="btn btn-info">Generar Constancia</button>
                            </div>
                            <div class="form-group col-md-12">
                                    <label for="fileUpload">Subir Plantilla:</label>
                                    <div class="custom-file">
                                        <input required type="file" class="custom-file-input" id="fileUpload" name="fileUpload" accept=".xls,.xlsx" onchange="updateFileName(this)">
                                        <label class="custom-file-label" for="fileUpload">Elija el archivo</label>
                                    </div>
                                </div>
                        </div>
                    </div>
                    <div class="row">
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-12">
                                <div class="row">
                                    <div class="form-group col-md-6">
                                        <label for="razonSocial">Razon Social:</label>
                                        <input type="text" class="form-control" value="INDHECA GRUPO CONSTRUCTOR" id="razonSocial" placeholder="Razon Social" name="razonSocial">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="rfc">RFC:</label>
                                        <input type="text" class="form-control" value="IGC-050407-LA9" id="rfc" name="rfc" placeholder="RFC">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="ocupacion">Ocupacion:</label>
                                        <input type="text" class="form-control" id="ocupacion" name="ocupacion" placeholder="Ocupacion">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="capacitador">Capacitador:</label>
                                        <input type="text" class="form-control" value="AVILA GARCIA DAVID" id="capacitador" name="capacitador" placeholder="Capacitador">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="registroACE">Registro ACE STPS:</label>
                                        <input type="text" class="form-control" value="AIGD830407-BH2-0005" id="registroACE" name="registroACE" placeholder="Registro ACE STPS">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="instructor">Instructor o Tutor:</label>
                                        <input type="text" class="form-control" value="ING. DAVID AVILA GARCIA" id="instructor" name="instructor" placeholder="Instructor o Tutor">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="patron">Patron o representante legal:</label>
                                        <input type="text" class="form-control" value="LIC. MARIA ELENA MEDINA GONZALEZ" id="patron" name="patron" placeholder="Patron o representante legal">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="representanteTrabajadores">Representante de los trabajadores:</label>
                                        <input type="text" class="form-control" value="LIC. VERÓNICA ZEPEDA USCANGA" id="representanteTrabajadores" name="representanteTrabajadores" placeholder="Representante de los trabajadores">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="curso">Curso:</label>
                                        <input type="text" class="form-control" id="curso" name="curso" placeholder="Curso">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="area">Area:</label>
                                        <input type="text" class="form-control" id="area" name="area" placeholder="Area">
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="folio">Folio:</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control" value="COAT-PRE-28-12-2024/" id="folio" name="folio" placeholder="Folio">
                                            <div class="input-group-append">
                                                <span class="input-group-text">-</span>
                                            </div>
                                            <input type="number" class="form-control" value="001" id="folioNumber" name="folioNumber" placeholder="Number">
                                        </div>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="impartido">Impartido:</label>
                                        <input type="text" class="form-control" value="Seybaplaya, Tabasco" id="impartido" name="impartido" placeholder="Impartido">
                                    </div>
                                </div>
                        </div>
                        <div class="col-md-12 text-dark">
                            <div class="accordion" id="accordionExample">
                                <div class="card">
                                    <div class="card-header" id="headingOne">
                                        <h2 class="mb-0">
                                            <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                                Firma Instructor
                                            </button>
                                        </h2>
                                    </div>
                                    <div id="collapseOne" class="collapse" aria-labelledby="headingOne" data-parent="#accordionExample">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label for="fileUploadInstructor">Subir Firma de Instructor:</label>
                                                <div class="custom-file">
                                                    <input type="file" class="custom-file-input" id="fileUploadInstructor" name="fileUploadInstructor" accept="image/*" onchange="updateFileName(this)">
                                                    <label class="custom-file-label" for="fileUploadInstructor">Elija el archivo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header" id="headingTwo">
                                        <h2 class="mb-0">
                                            <button class="btn btn-link btn-block text-left collapsed" type="button" data-toggle="collapse" data-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                                Firma Representante Legal
                                            </button>
                                        </h2>
                                    </div>
                                    <div id="collapseTwo" class="collapse" aria-labelledby="headingTwo" data-parent="#accordionExample">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label for="fileUploadRepresentanteLegal">Subir Firma Representante Legal:</label>
                                                <div class="custom-file">
                                                    <input type="file" class="custom-file-input" id="fileUploadRepresentanteLegal" name="fileUploadRepresentanteLegal" accept="image/*" onchange="updateFileName(this)">
                                                    <label class="custom-file-label" for="fileUploadRepresentanteLegal">Elija el archivo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header" id="headingThree">
                                        <h2 class="mb-0">
                                            <button class="btn btn-link btn-block text-left collapsed" type="button" data-toggle="collapse" data-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                                Firma de Representante de los Trabajadores
                                            </button>
                                        </h2>
                                    </div>
                                    <div id="collapseThree" class="collapse" aria-labelledby="headingThree" data-parent="#accordionExample">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label for="fileUploadRepresentanteTrabajadores">Subir Firma de Representante de los Trabajadores:</label>
                                                <div class="custom-file">
                                                    <input type="file" class="custom-file-input" id="fileUploadRepresentanteTrabajadores" name="fileUploadRepresentanteTrabajadores" accept="image/*" onchange="updateFileName(this)">
                                                    <label class="custom-file-label" for="fileUploadRepresentanteTrabajadores">Elija el archivo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header" id="headingLogo">
                                        <h2 class="mb-0">
                                            <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapseLogo" aria-expanded="true" aria-controls="collapseLogo">
                                                Logo de empresa
                                            </button>
                                        </h2>
                                    </div>
                                    <div id="collapseLogo" class="collapse" aria-labelledby="headingLogo" data-parent="#accordionExample">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label for="logoUpload">Subir logo:</label>
                                                <div class="custom-file">
                                                    <input type="file" class="custom-file-input" id="logoUpload" name="logoUpload" accept="image/*" onchange="updateFileName(this)">
                                                    <label class="custom-file-label" for="logoUpload">Elija el logo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card">
                                    <div class="card-header" id="headingLogoCurso">
                                        <h2 class="mb-0">
                                            <button class="btn btn-link btn-block text-left collapsed" type="button" data-toggle="collapse" data-target="#collapseLogoCurso" aria-expanded="false" aria-controls="collapseLogoCurso">
                                                Logo de curso
                                            </button>
                                        </h2>
                                    </div>
                                    <div id="collapseLogoCurso" class="collapse" aria-labelledby="headingLogoCurso" data-parent="#accordionExample">
                                        <div class="card-body">
                                            <div class="form-group">
                                                <label for="logoCursoUpload">Subir logo de curso:</label>
                                                <div class="custom-file">
                                                    <input type="file" class="custom-file-input" id="logoCursoUpload" name="logoCursoUpload" accept="image/*" onchange="updateFileName(this)">
                                                    <label class="custom-file-label" for="logoCursoUpload">Elija el logo</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="pdf.js"></script>
        <script src="formato.js"></script>
        <script src="constancia.js"></script>
        <script src="app.js"></script>
    </body>
</html>
